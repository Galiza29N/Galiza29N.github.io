<!DOCTYPE html>
<html lang="gl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="canonical" href="https://galiza29n.github.io/" />
  <meta name="description" content="Compara as túas respostas co programa do BNG, consulta as votacións no Congreso e explora os resultados por provincia das xerais de 2023." />
  <title>Canto coincides co BNG? · 29N Datos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F7F6F2;
      --surface: #FFFFFF;
      --surface-alt: #F1EFE8;
      --border: #DDD9CE;
      --border-strong: #B9B4A6;
      --ink: #161614;
      --muted: #5C5A55;
      --green: #1B6B4A;
      --green-bg: #EBF5F0;
      --red: #B83B2A;
      --red-bg: #FBECE9;
      --amber: #B47412;
      --amber-bg: #FDF5E6;
      --blue: #1D4E89;
      --radius: 6px;
      --font-serif: 'Newsreader', Georgia, serif;
      --font-sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--ink); font-family: var(--font-sans);
      line-height: 1.5; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
    }

    .topbar { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.96); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); }
    .topbar-inner { max-width: 1040px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 54px; }
    .brand { font-family: var(--font-mono); font-size: 0.78rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
    .lang-switch { display: inline-flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; background: var(--bg); flex-shrink: 0; }
    .lang-btn { border: none; background: transparent; padding: 5px 10px; font-family: var(--font-mono); font-size: 0.75rem; font-weight: 600; color: var(--muted); cursor: pointer; }
    .lang-btn.active { background: var(--ink); color: #FFF; }

    .tabs-wrap { border-top: 1px solid var(--border); background: var(--surface); }
    .tabs-nav { max-width: 1040px; margin: 0 auto; padding: 0 20px; display: flex; gap: 24px; overflow-x: auto; scrollbar-width: none; }
    .tabs-nav::-webkit-scrollbar { display: none; }
    .tab-btn { border: none; background: transparent; padding: 12px 2px; font-family: var(--font-sans); font-size: 0.9rem; font-weight: 500; color: var(--muted); cursor: pointer; white-space: nowrap; border-bottom: 2.5px solid transparent; }
    .tab-btn:hover { color: var(--ink); }
    .tab-btn.active { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }

    .container { max-width: 1040px; margin: 0 auto; padding: 26px 20px 64px; }
    .hero { max-width: 820px; margin-bottom: 24px; }
    .hero h1 { font-family: var(--font-serif); font-size: clamp(1.85rem, 3.8vw, 2.55rem); font-weight: 700; line-height: 1.12; letter-spacing: -0.02em; margin-bottom: 8px; }
    .hero p { font-size: 0.98rem; color: var(--muted); }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Accordions */
    .accordion-group { border-top: 1px solid var(--border); }
    details.acc { border-bottom: 1px solid var(--border); }
    details.acc summary { list-style: none; padding: 11px 0; font-size: 0.86rem; font-weight: 500; color: var(--muted); cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; }
    details.acc summary::-webkit-details-marker { display: none; }
    details.acc summary:hover { color: var(--ink); }
    details.acc summary::after { content: "+"; font-family: var(--font-mono); font-size: 1rem; color: var(--muted); margin-left: 12px; }
    details.acc[open] summary::after { content: "−"; }
    .acc-body { padding: 0 0 13px; font-size: 0.87rem; color: var(--ink); line-height: 1.55; }

    .bar-track { height: 8px; background: var(--surface-alt); border-radius: 3px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s ease; }

    /* PESTAÑA 1: TEST */
    .test-shell { max-width: 780px; }
    .test-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-family: var(--font-mono); font-size: 0.76rem; color: var(--muted); }
    .num-strip { display: grid; grid-template-columns: repeat(18, 1fr); gap: 4px; margin-bottom: 18px; }
    .num-dot { border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-family: var(--font-mono); font-size: 0.68rem; font-weight: 600; height: 24px; border-radius: 3px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
    .num-dot.st-favor { background: var(--green); border-color: var(--green); color: #FFF; }
    .num-dot.st-contra { background: var(--red); border-color: var(--red); color: #FFF; }
    .num-dot.st-neutral { background: var(--surface-alt); border-color: var(--border-strong); color: var(--ink); }
    .num-dot.is-current { outline: 2px solid var(--ink); outline-offset: 1px; color: var(--ink); }
    .num-dot.is-current.st-favor, .num-dot.is-current.st-contra { color: #FFF; }

    .q-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 14px; }
    .q-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .topic-tag { font-family: var(--font-mono); font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; background: var(--surface-alt); border: 1px solid var(--border); padding: 2px 8px; border-radius: 3px; }
    .ref-tag { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); }
    .q-title { font-family: var(--font-serif); font-size: clamp(1.35rem, 2.6vw, 1.7rem); font-weight: 600; line-height: 1.2; margin-bottom: 8px; }
    .q-desc { font-size: 0.96rem; color: var(--muted); margin-bottom: 20px; }
    .vote-row { display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 10px; margin-bottom: 20px; }
    .vote-btn { border: 1px solid var(--border-strong); background: var(--bg); color: var(--ink); border-radius: 5px; padding: 13px 10px; font-family: var(--font-sans); font-size: 0.88rem; font-weight: 600; cursor: pointer; }
    .vote-btn:hover { border-color: var(--ink); }
    .vote-btn.selected-favor { background: var(--green); border-color: var(--green); color: #FFF; }
    .vote-btn.selected-neutral { background: var(--ink); border-color: var(--ink); color: #FFF; }
    .vote-btn.selected-contra { background: var(--red); border-color: var(--red); color: #FFF; }

    .test-nav { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .btn-secondary { border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); padding: 10px 15px; border-radius: 5px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { border: 1px solid var(--ink); background: var(--ink); color: #FFF; padding: 10px 17px; border-radius: 5px; font-size: 0.86rem; font-weight: 600; cursor: pointer; }
    .btn-early { border: 1px solid var(--green); background: var(--green-bg); color: var(--green); padding: 10px 14px; border-radius: 5px; font-size: 0.83rem; font-weight: 600; cursor: pointer; }

    .results-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 26px 24px; margin-bottom: 24px; }
    .result-kicker { font-family: var(--font-mono); font-size: 0.76rem; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
    .result-headline { font-family: var(--font-serif); font-size: clamp(1.65rem, 3.2vw, 2.2rem); font-weight: 700; margin-bottom: 14px; }
    .area-bars { margin: 18px 0 22px; display: flex; flex-direction: column; gap: 12px; }
    .area-row-top { display: flex; justify-content: space-between; font-size: 0.84rem; margin-bottom: 4px; }
    .area-row-top .area-val { font-family: var(--font-mono); font-weight: 600; font-size: 0.8rem; }
    .result-warn { background: var(--amber-bg); border-left: 3px solid var(--amber); padding: 12px 14px; font-size: 0.88rem; margin: 14px 0; }
    .lists-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 18px 0; }
    .list-col { border: 1px solid var(--border); border-radius: 5px; padding: 15px; background: var(--bg); }
    .list-col h3 { font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase; margin-bottom: 10px; }
    .list-col.agree h3 { color: var(--green); }
    .list-col.clash h3 { color: var(--red); }
    .list-col ul { list-style: none; display: flex; flex-direction: column; gap: 7px; font-size: 0.85rem; }
    .list-col li { padding-left: 12px; position: relative; }
    .list-col.agree li::before { content: "·"; position: absolute; left: 0; color: var(--green); font-weight: 700; }
    .list-col.clash li::before { content: "·"; position: absolute; left: 0; color: var(--red); font-weight: 700; }
    .bridge-note { background: var(--surface-alt); border-left: 3px solid var(--ink); padding: 13px 15px; font-size: 0.87rem; margin: 18px 0; }
    .actions-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .copy-feedback { font-family: var(--font-mono); font-size: 0.78rem; color: var(--green); align-self: center; }
    .next-section-title { font-family: var(--font-mono); font-size: 0.76rem; font-weight: 600; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }
    .next-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .next-card { background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--ink); border-radius: var(--radius); padding: 15px; text-align: left; cursor: pointer; }
    .next-card:hover { border-color: var(--border-strong); background: #FCFBF9; }
    .next-card.nc-green { border-top-color: var(--green); }
    .next-card.nc-red { border-top-color: var(--red); }
    .next-card h4 { font-family: var(--font-serif); font-size: 1.02rem; margin-bottom: 5px; color: var(--ink); }
    .next-card span { font-size: 0.8rem; color: var(--muted); }

    /* PESTAÑA 2: CONGRESO */
    .sub-controls { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
    .seg-switch { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 5px; padding: 3px; gap: 3px; }
    .seg-btn { border: none; background: transparent; padding: 7px 12px; border-radius: 4px; font-size: 0.82rem; font-weight: 500; color: var(--muted); cursor: pointer; }
    .seg-btn.active { background: var(--ink); color: #FFF; font-weight: 600; }
    .sem-bar { display: flex; flex-wrap: wrap; gap: 8px; }
    .sem-pill { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 5px; padding: 6px 11px; font-family: var(--font-mono); font-size: 0.76rem; font-weight: 600; color: var(--ink); cursor: pointer; }
    .sem-pill.active { border-color: var(--ink); background: var(--surface-alt); }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot-green { background: var(--green); } .dot-amber { background: var(--amber); } .dot-red { background: var(--red); }
    .congreso-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 18px; align-items: start; margin-bottom: 28px; }
    .balance-list { display: flex; flex-direction: column; gap: 14px; }
    .bal-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
    .bal-badge { font-family: var(--font-mono); font-size: 0.7rem; font-weight: 600; text-transform: uppercase; margin-bottom: 4px; }
    .bal-badge.st-boe { color: var(--green); } .bal-badge.st-parcial { color: var(--amber); } .bal-badge.st-decaida { color: var(--red); }
    .bal-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
    .bal-head h3 { font-family: var(--font-serif); font-size: 1.2rem; font-weight: 600; }
    .bal-kpi { font-family: var(--font-mono); font-size: 0.92rem; font-weight: 600; white-space: nowrap; }
    .milestones { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
    .ms-step .ms-bar { height: 6px; background: var(--border); border-radius: 2px; margin-bottom: 4px; }
    .ms-step.done-boe .ms-bar { background: var(--green); } .ms-step.done-parcial .ms-bar { background: var(--amber); } .ms-step.done-decaida .ms-bar { background: var(--red); }
    .ms-step span { font-size: 0.7rem; color: var(--muted); display: block; }
    .ms-step.is-on span { color: var(--ink); font-weight: 600; }
    .bal-summary { font-size: 0.88rem; color: var(--muted); margin-bottom: 12px; }
    .hemi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; position: sticky; top: 112px; }
    .hemi-card h3 { font-family: var(--font-serif); font-size: 1.25rem; margin-bottom: 4px; }
    .hemi-sub { font-family: var(--font-mono); font-size: 0.75rem; font-weight: 600; color: var(--red); margin-bottom: 12px; }
    .rdl-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .rdl-btn { border: 1px solid var(--border-strong); background: var(--bg); color: var(--ink); padding: 8px 6px; border-radius: 4px; font-family: var(--font-mono); font-size: 0.74rem; font-weight: 600; cursor: pointer; }
    .rdl-btn.active { background: var(--ink); border-color: var(--ink); color: #FFF; }
    .hemi-svg-wrap { width: 100%; max-width: 340px; margin: 4px auto 10px; }
    .hemi-legend { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 0.73rem; font-weight: 600; margin-bottom: 12px; }
    .hemi-note { font-size: 0.84rem; color: var(--muted); margin-bottom: 12px; }
    .coinc-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
    .coinc-title { font-family: var(--font-mono); font-size: 0.76rem; font-weight: 600; color: var(--muted); text-transform: uppercase; margin-bottom: 14px; }
    .coinc-row { display: grid; grid-template-columns: 105px 1fr 64px 150px; align-items: center; gap: 12px; margin-bottom: 10px; }
    .coinc-row:last-child { margin-bottom: 0; }
    .coinc-party { font-size: 0.88rem; font-weight: 600; }
    .coinc-score { font-family: var(--font-mono); font-size: 0.82rem; font-weight: 600; text-align: right; }
    .coinc-badge { font-family: var(--font-mono); font-size: 0.68rem; background: var(--surface-alt); border: 1px solid var(--border); padding: 2px 7px; border-radius: 3px; text-align: center; }
    .votes-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .v-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
    .v-meta { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); margin-bottom: 4px; }
    .v-title { font-family: var(--font-serif); font-size: 1.1rem; font-weight: 600; margin-bottom: 12px; }
    .v-pills { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 12px; }
    .vp { border: 1px solid var(--border); border-radius: 4px; padding: 6px 2px; text-align: center; background: var(--surface-alt); }
    .vp span { display: block; font-family: var(--font-mono); }
    .vp .vp-p { font-size: 0.64rem; color: var(--muted); margin-bottom: 2px; }
    .vp .vp-v { font-size: 0.72rem; font-weight: 700; }
    .vp.v-si { background: var(--green-bg); border-color: var(--green); } .vp.v-si .vp-v { color: var(--green); }
    .vp.v-no { background: var(--red-bg); border-color: var(--red); } .vp.v-no .vp-v { color: var(--red); }
    .vp.v-ab { background: var(--amber-bg); border-color: var(--amber); } .vp.v-ab .vp-v { color: var(--amber); }

    /* PESTAÑA 3: VOTO POR PROVINCIA */
    .prov-selector {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .prov-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      text-align: left;
      cursor: pointer;
    }
    .prov-btn:hover { border-color: var(--border-strong); }
    .prov-btn.active { border: 2px solid var(--ink); background: #FCFBF9; }
    .prov-name { font-family: var(--font-serif); font-size: 1.12rem; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
    .prov-st { font-family: var(--font-mono); font-size: 0.7rem; font-weight: 600; text-transform: uppercase; }
    .prov-st.st-direct { color: var(--green); }
    .prov-st.st-hard { color: var(--amber); }

    .prov-grid {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 18px;
      margin-bottom: 22px;
      align-items: start;
    }

    .prov-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .prov-kicker { font-family: var(--font-mono); font-size: 0.74rem; font-weight: 600; margin-bottom: 6px; }
    .prov-card h3 { font-family: var(--font-serif); font-size: 1.25rem; margin-bottom: 6px; }
    .prov-desc { font-size: 0.88rem; color: var(--muted); margin-bottom: 16px; }

    .pbar-list { display: flex; flex-direction: column; gap: 11px; margin-bottom: 16px; }
    .pbar-row { display: grid; grid-template-columns: 78px 1fr 130px; align-items: center; gap: 10px; }
    .pbar-lbl { font-size: 0.84rem; font-weight: 600; }
    .pbar-val { font-family: var(--font-mono); font-size: 0.74rem; color: var(--muted); text-align: right; }

    .seat-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 16px; }
    .seat-btn { border: 1px solid var(--border-strong); background: var(--bg); color: var(--ink); padding: 9px 6px; border-radius: 4px; font-family: var(--font-mono); font-size: 0.76rem; font-weight: 600; cursor: pointer; }
    .seat-btn.active { background: var(--ink); border-color: var(--ink); color: #FFF; }

    .seat-points { list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 0.87rem; }
    .seat-points li { padding-left: 14px; position: relative; }
    .seat-points li::before { content: "·"; position: absolute; left: 0; font-weight: 700; color: var(--ink); }

    .deep-acc-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px 20px;
      margin-bottom: 12px;
    }
    .deep-acc-card details.acc { border-bottom: none; }
    .deep-acc-card details.acc summary { color: var(--ink); font-weight: 600; font-size: 0.92rem; padding: 14px 0; }

    .case-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 6px; }
    .case-item { background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 12px 14px; font-size: 0.84rem; }
    .case-item strong { display: block; margin-bottom: 4px; font-size: 0.86rem; }

    .youth-bars { display: flex; flex-direction: column; gap: 10px; margin: 10px 0 12px; }


    @media (max-width: 860px) {
      .congreso-grid, .prov-grid, .votes-grid, .case-grid { grid-template-columns: 1fr; }
      .prov-selector { grid-template-columns: repeat(2, 1fr); }
      .hemi-card { position: static; }
      .coinc-row { grid-template-columns: 90px 1fr 54px; }
      .coinc-badge { display: none; }
    }
    @media (max-width: 720px) {
      .num-strip { grid-template-columns: repeat(9, 1fr); }
      .vote-row, .lists-grid, .next-grid { grid-template-columns: 1fr; }
      .q-card { padding: 18px; }
      .pbar-row { grid-template-columns: 64px 1fr 112px; }
    }
  
    .nav-link { text-decoration: none; border: none; background: transparent; padding: 14px 12px; font-size: 0.86rem; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
    .nav-link:hover { color: var(--ink); }
    .nav-link.active { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
    .btn-wa { border: 1px solid var(--green); background: var(--green-bg); color: var(--green); padding: 9px 14px; border-radius: 5px; font-size: 0.84rem; font-weight: 600; cursor: pointer; }
    .btn-wa:hover { background: var(--green); color: #FFF; }
    .sources-footer { margin-top: 44px; padding-top: 22px; border-top: 1px solid var(--border); }
    .sf-title { font-family: var(--font-mono); font-size: 0.72rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }
    .sf-text { font-size: 0.82rem; color: var(--muted); line-height: 1.55; max-width: 820px; }


    /* Dúbidas e bulos */
    #panel-bulos {
      max-width: 980px;
      margin-inline: auto;
      --mono: var(--font-mono);
      --serif: var(--font-serif);
      --blue-bg: #EDF3FA;
    }
    #panel-bulos .hero{max-width:780px;margin-bottom:22px}

    function t(key, ...args) { const val = I18N[state.lang][key]; return typeof val === "function" ? val(...args) : val; }
    function activeQuestions() { return state.extraUnlocked ? QUESTIONS : QUESTIONS.slice(0, 18); }
    function stanceCount(list) { return list.filter(q => state.answers[q.id] === "favor" || state.answers[q.id] === "contra").length; }

    function sourceLinks(keys) {
      return keys.map(key => {
        const ref = SOURCES[key];
        return `<a href="${ref.url}" target="_blank" rel="noopener noreferrer">${ref[state.lang]}</a>`;
      }).join(" · ");
    }

    function applyStaticI18n() {
      document.documentElement.lang = state.lang;
      document.querySelector(".tabs-nav").setAttribute("aria-label", state.lang === "gl" ? "Seccións" : "Secciones");
      document.getElementById("source-index").innerHTML = sourceLinks(["program", "results", "rules", "ap9", "language"]);
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (I18N[state.lang][key]) el.textContent = t(key);
      });
      document.querySelectorAll(".lang-btn").forEach(b => {
        const active = b.dataset.lang === state.lang;
        b.classList.toggle("active", active);
        b.setAttribute("aria-pressed", String(active));
      });
    }

    function switchTab(tabId) {
      state.tab = tabId;

      document.querySelectorAll(".tab-btn").forEach(b => {
        const active = b.dataset.tab === tabId;
        b.classList.toggle("active", active);
        b.setAttribute("aria-pressed", String(active));
      });
      document.querySelectorAll(".tab-panel").forEach(p => p.classList.toggle("active", p.id === `panel-${tabId}`));
      window.scrollTo({ top: 0, behavior: "auto" });
    }

    function renderTest() {
      const root = document.getElementById("test-root");
      const list = activeQuestions();
      if (state.showResults) { renderResults(root, list); return; }

      const q = list[state.currentIdx], ql = q[state.lang], ans = state.answers[q.id] || null, stCount = stanceCount(list);
      const dotsHtml = list.map((item, idx) => {
        const a = state.answers[item.id];
        return `<button class="num-dot ${a ? `st-${a}` : ""} ${idx === state.currentIdx ? "is-current" : ""}" data-jump="${idx}">${idx + 1}</button>`;
      }).join("");

      root.innerHTML = `
        <div class="test-meta"><span>${t("q_counter", state.currentIdx + 1, list.length, stCount)}</span></div>
        <div class="num-strip">${dotsHtml}</div>
        <div class="q-card">
          <div class="q-top"><span class="topic-tag">${ql.tag}</span><a class="ref-tag" href="https://xerais2026.bng.gal/wp-content/uploads/2026/11/bng-xerais-2026-programa-electoral.pdf" target="_blank" rel="noopener noreferrer">${q.ref} · PDF</a></div>
          <h2 class="q-title">${ql.t}</h2>
          <p class="q-desc">${ql.d}</p>
          <div class="vote-row">
            <button class="vote-btn ${ans === 'favor' ? 'selected-favor' : ''}" data-vote="favor">${t("btn_favor")}</button>
            <button class="vote-btn ${ans === 'neutral' ? 'selected-neutral' : ''}" data-vote="neutral">${t("btn_neutral")}</button>
            <button class="vote-btn ${ans === 'contra' ? 'selected-contra' : ''}" data-vote="contra">${t("btn_contra")}</button>
          </div>
          <div class="accordion-group">
            <details class="acc"><summary>${t("acc_what")}</summary><div class="acc-body">${ql.w}</div></details>
            <details class="acc"><summary>${t("acc_prac")}</summary><div class="acc-body">${ql.p}</div></details>
          </div>
        </div>
        <div class="test-nav">
          <button class="btn-secondary" id="btn-prev" ${state.currentIdx === 0 ? "disabled" : ""}>${t("btn_prev")}</button>
          ${stCount >= 8 ? `<button class="btn-early" id="btn-early">${t("btn_early", stCount)}</button>` : ""}
          <button class="btn-primary" id="btn-next">${state.currentIdx === list.length - 1 ? t("btn_finish") : t("btn_next")}</button>
        </div>
      `;

      root.querySelectorAll("[data-jump]").forEach(b => b.addEventListener("click", () => { state.currentIdx = Number(b.dataset.jump); renderTest(); }));
      root.querySelectorAll("[data-vote]").forEach(btn => btn.addEventListener("click", () => {
        state.answers[q.id] = btn.dataset.vote;
        if (state.currentIdx < list.length - 1) state.currentIdx++; else state.showResults = true;
        renderTest();
      }));
      root.querySelector("#btn-prev").addEventListener("click", () => { if (state.currentIdx > 0) { state.currentIdx--; renderTest(); } });
      const early = root.querySelector("#btn-early");
      if (early) early.addEventListener("click", () => { state.showResults = true; renderTest(); });
      root.querySelector("#btn-next").addEventListener("click", () => { if (state.currentIdx < list.length - 1) state.currentIdx++; else state.showResults = true; renderTest(); });
    }

    function paintCover(canvas, format, pct, agree, total, url) {
      canvas.width = format === "x" ? 1600 : 1080;
      canvas.height = {instagram: 1920, whatsapp: 1080, x: 900}[format];
      const c = canvas.getContext("2d");
      const gl = state.lang === "gl";
      const navy = "#10263c", cream = "#fff7e5", lake = "#1858bc", ice = "#a4d9fa", lemon = "#f2ff7d";
      function rect(x, y, w, h, color) {
        c.fillStyle = color;
        c.fillRect(x, y, w, h);
      }
      function polygon(points, color) {
        c.fillStyle = color;
        c.beginPath();
        points.forEach(([x,y],i) => i ? c.lineTo(x,y) : c.moveTo(x,y));
        c.closePath();
        c.fill();
      }
      function type(text, x, y, font, color, maxWidth = 920) {
        c.font = font;
        c.fillStyle = color;
        c.fillText(text, x, y, maxWidth);
      }

      function drawQr(right, y, maxSize) {
        if (!url || url.length > 1000) return;
        const code = qrcode(0, "M");
        code.addData(url);
        code.make();
        const count = code.getModuleCount();
        const unit = Math.floor(maxSize / (count + 8));
        if (unit < 2) return;
        const size = unit * (count + 8);
        const x = right - size;
        rect(x, y, size, size, "#fff");
        for (let row = 0; row < count; row++) {
          for (let col = 0; col < count; col++) {
            if (code.isDark(row, col)) rect(x+(col+4)*unit, y+(row+4)*unit, unit, unit, navy);
          }
        }
      }
      const question = gl ? "Canto coincides" : "¿Cuánto coincides";
      const subject = gl ? "co BNG?" : "con el BNG?";
      const intro = gl ? "Eu saquei un" : "Yo saqué un";
      const detail = gl ? `Coincidín en ${agree} de ${total} medidas.` : `Coincidí en ${agree} de ${total} medidas.`;
      const invitation = gl ? "E ti, canto sacarías?" : "¿Y tú, cuánto sacarías?";
      const domain = url ? new URL(url).host : "";

      if (format === "x") {
        rect(0, 0, 1600, 900, cream);
        polygon([[240,0],[440,0],[910,470],[910,670]], ice);
        for (let i=0; i<8; i++) {
          const x=470+i*12;
          polygon([[x,0],[x+3,0],[910,910-x-3],[910,910-x]], lake);
        }
        polygon([[840,0],[1600,0],[1600,900],[664,900]], navy);
        polygon([[855,0],[1600,0],[1600,900],[680,900]], lake);
        rect(70, 91, 10, 30, lake);
        type("29N  /  DATOS", 96, 115, "bold 29px monospace", navy);
        type(question, 64, 385, "bold 92px Georgia, serif", navy, 690);
        type(subject, 60, 503, "italic bold 113px Georgia, serif", navy, 655);
        type(intro, 890, 236, "bold 53px sans-serif", cream);
        type(pct+"%", 865, 485, "bold 214px sans-serif", lemon, 660);
        type(detail, 886, 570, "39px Georgia, serif", cream, 640);
        rect(885, 645, 640, 2, ice);
        type(invitation, 84, 739, "bold 42px Georgia, serif", navy, 580);
        if (url) {
          type(domain, 85, 792, "27px monospace", navy, 564);
          drawQr(1525, 670, 173);
        }
        return;
      }

      if (format === "whatsapp") {
        rect(0, 0, 1080, 1080, cream);
        polygon([[550,0],[765,0],[1080,315],[1080,530]], ice);
        for (let i=0; i<8; i++) {
          const x=800+i*12;
          polygon([[x,0],[x+3,0],[1080,1080-x-3],[1080,1080-x]], lake);
        }
        rect(63, 65, 10, 31, lake);
        type("29N  /  DATOS", 89, 91, "bold 29px monospace", navy);
        type(question, 59, 231, "bold 92px Georgia, serif", navy, 950);
        type(subject, 57, 334, "italic bold 108px Georgia, serif", navy, 915);
        polygon([[0,440],[1080,353],[1080,1080],[0,1080]], navy);
        polygon([[0,455],[1080,368],[1080,1080],[0,1080]], lake);
        type(intro, 70, 540, "bold 48px sans-serif", cream);
        type(pct+"%", 55, 756, "bold 232px sans-serif", lemon, 920);
        type(detail, 73, 822, "40px Georgia, serif", cream, 920);
        rect(72, 864, 925, 2, ice);
        type(invitation, 70, 945, "bold 49px Georgia, serif", cream, 715);
        if (url) {
          type(domain, 73, 1000, "27px monospace", cream, 676);
          drawQr(1005, 886, 158);
        }
        return;
      }
      rect(0, 0, 1080, 1920, cream);
      // A broad blue diagonal and offset fine lines echo the Galician flag.
      polygon([[410,0],[790,0],[1080,290],[1080,670]], ice);
      for (let i = 0; i < 8; i++) {
        const offset = i * 14;
        polygon([[828+offset,0],[831+offset,0],[1080,249-offset],[1080,252-offset]], lake);
      }
      rect(80, 236, 16, 39, lake);
      type("29N  /  DATOS", 115, 265, "bold 32px monospace", navy);
      type(gl ? "Canto coincides" : "¿Cuánto coincides", 73, 466, "bold 110px Georgia, serif", navy, 934);
      type(gl ? "co BNG?" : "con el BNG?", 73, 595, "italic bold 130px Georgia, serif", navy, 930);

      polygon([[0,782],[1080,640],[1080,1920],[0,1920]], lake);
      polygon([[0,782],[1080,640],[1080,660],[0,802]], navy);
      type(gl ? "Eu saquei un" : "Yo saqué un", 80, 914, "bold 66px sans-serif", cream);
      type(String(pct) + "%", 60, 1246, "bold 320px sans-serif", lemon, 965);
      type(gl ? `Coincidín en ${agree} de ${total} medidas.` : `Coincidí en ${agree} de ${total} medidas.`,
           85, 1342, "48px Georgia, serif", cream, 910);
      rect(85, 1436, 910, 3, ice);
      type(gl ? "E ti, canto sacarías?" : "¿Y tú, cuánto sacarías?", 83, 1563, "bold 60px Georgia, serif", cream, url ? 696 : 910);
      if (url) {
        type(gl ? "Fai o test" : "Haz el test", 85, 1634, "bold 34px sans-serif", lemon);
        const domain = new URL(url).host;
        type(domain, 85, 1686, "28px monospace", cream, 628);
        drawQr(995, 1474, 218);
      }
    }

    function attachSharing(root, pct, agree, total) {
      const panel = root.querySelector("#instagram-post");
      if (!panel) return;
      const buttons = root.querySelectorAll("[data-cover-format]");
      const save = panel.querySelector("[download]");
      const fb = root.querySelector("#copy-fb");
      const url = document.querySelector('link[rel="canonical"]').getAttribute("href");
      const caption = t("social_text", pct);
      const message = caption + "\n" + url;
      const xLink = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(caption);
      root.querySelector(".share-x").setAttribute("href", xLink + "&url=" + encodeURIComponent(url));
      root.querySelector(".share-wa-text").setAttribute("href", "https://wa.me/?text=" + encodeURIComponent(message));

      async function copyText(text, success) {
        try {
          await navigator.clipboard.writeText(text);
          fb.textContent = success;
        } catch {
          const field = root.querySelector(".manual-copy");
          field.hidden = false;
          field.value = text;
          field.focus();
          field.select();
        }
      }
      root.querySelector("#btn-copy").onclick = () => copyText(message, t("copied"));
      const copyLink = panel.querySelector("[data-copy-url]");
      copyLink.hidden = !url;
      copyLink.onclick = () => copyText(url, t("url_copied"));
      let lastFormat = "";
      let file;
      for (const button of buttons) button.onclick = async () => {
        const format = button.dataset.coverFormat;
        const story = format === "instagram";
        const platform = {x: "X", whatsapp: "WhatsApp", instagram: "Instagram"}[format];
        try {
          if (lastFormat !== format) {
            const canvas = panel.querySelector("canvas");
            paintCover(canvas, format, pct, agree, total, url);
            const png = canvas.toDataURL("image/png");
            save.href = png;
            save.download = `29n-${format}-${pct}-${state.lang}.png`;
            file = undefined;
            lastFormat = format;
            if (typeof File === "function" && navigator.canShare && navigator.share) {
              const raw = atob(png.slice(png.indexOf(",")+1));
              const bytes = Uint8Array.from(raw, char => char.charCodeAt(0));
              file = new File([bytes], save.download, {type: "image/png"});
            }
          }
          panel.dataset.format = format;
          panel.hidden = false;
          buttons.forEach(b => b.setAttribute("aria-expanded", String(b === button)));
          panel.querySelector(".share-x").hidden = format !== "x";
          panel.querySelector(".share-wa-text").hidden = format !== "whatsapp";
          copyLink.hidden = !url || !story;
          save.textContent = story ? t("ig_story_save") : t("cover_save");
          panel.querySelector(".reading-note").textContent = story ? t("ig_story_tip") : t("cover_tip", platform);
          fb.textContent = "";
          if (file) {
            const data = {files: [file]};
            if (!story && navigator.canShare({files: [file], text: message})) data.text = message;
            if (navigator.canShare(data)) await navigator.share(data);
          }
        } catch (error) {
          if (error.name !== "AbortError") {
            if (lastFormat !== format) panel.hidden = true;
            fb.textContent = t("cover_error");
          }
        }
      };
    }

    function renderResults(root, list) {
      const agree = [], clash = [];
      const areas = {
        pocket: { ok:0, tot:0, lbl:t("area_pocket") },
        galiza: { ok:0, tot:0, lbl:t("area_galiza") },
        model:  { ok:0, tot:0, lbl:t("area_model") }
      };
      list.forEach(q => {
        const a = state.answers[q.id];
        if (a === "favor") { agree.push(q); areas[q.area].ok++; areas[q.area].tot++; }
        else if (a === "contra") { clash.push(q); areas[q.area].tot++; }
      });
      const totalStance = agree.length + clash.length, validPct = totalStance >= 8;
      const pct = validPct ? Math.round((agree.length / totalStance) * 100) : 0;

      const neutral = list.filter(q => state.answers[q.id] === "neutral").length;
      const unanswered = list.length - totalStance - neutral;
      const areaBarsHtml = Object.values(areas).filter(a => a.tot > 0).map(a => {
        const ap = Math.round((a.ok / a.tot) * 100);
        const col = ap >= 65 ? "var(--green)" : (ap >= 40 ? "var(--amber)" : "var(--red)");
        return `<div><div class="area-row-top"><span>${a.lbl}</span><span class="area-val" style="color:${col}">${a.ok}/${a.tot} (${ap}%)</span></div><div class="bar-track"><div class="bar-fill" style="width:${ap}%;background:${col}"></div></div></div>`;
      }).join("");

      root.innerHTML = `
        <div class="results-box">
          <div class="result-kicker">${t("res_kicker")}</div>
          <h2 class="result-headline">${totalStance ? t("res_match", agree.length, totalStance) : (state.lang === "gl" ? "Aínda non hai respostas a favor ou en contra" : "Todavía no hay respuestas a favor o en contra")}${validPct ? ` (${pct}%)` : ""}</h2>
          <p class="reading-note">${t("calc")} ${t("neutral")}: ${neutral}. ${t("skipped")}: ${unanswered}.</p>
          ${validPct ? `<div class="area-bars">${areaBarsHtml}</div>` : `<div class="result-warn">${t("res_min_warn", totalStance)}</div>`}
          <div class="lists-grid">
            <div class="list-col agree"><h3>${t("res_agree")} (${agree.length})</h3><ul>${agree.length ? agree.map(q => `<li>${q[state.lang].t}</li>`).join("") : `<li>${t("res_empty")}</li>`}</ul></div>
            <div class="list-col clash"><h3>${t("res_clash")} (${clash.length})</h3><ul>${clash.length ? clash.map(q => `<li>${q[state.lang].t}</li>`).join("") : `<li>${t("res_empty")}</li>`}</ul></div>
          </div>
          <div class="bridge-note">${t("res_bridge")}</div>
          <div class="actions-row">
            ${!state.extraUnlocked ? `<button class="btn-primary" id="btn-extra">${t("btn_extra")}</button>` : ""}
            ${validPct ? `<button class="btn-secondary" id="btn-copy">${t("btn_copy")}</button><button class="btn-wa" id="btn-wa" data-cover-format="whatsapp" aria-expanded="false" aria-controls="instagram-post">Compartir por WhatsApp</button>
              <button class="btn-secondary share-ig" id="btn-instagram" data-cover-format="instagram" aria-expanded="false" aria-controls="instagram-post">Compartir en Instagram</button>
              <button class="btn-secondary" id="btn-x" data-cover-format="x" aria-expanded="false" aria-controls="instagram-post">Compartir en X</button>` : ""}
            <button class="btn-secondary" id="btn-restart">${t("btn_restart")}</button>
            <span class="copy-feedback" id="copy-fb" role="status"></span>
          </div>
          ${validPct ? `<div class="instagram-card" id="instagram-post" hidden>
            <canvas role="img" aria-label="${t("social_text", pct)}"></canvas>
            <p class="reading-note">${t("ig_story_tip")}</p>
            <div class="actions-row">
              <a class="btn-secondary" download>${t("ig_story_save")}</a>
              <a class="btn-secondary share-x" target="_blank" rel="noopener noreferrer" hidden>${t("open_x")}</a>
              <a class="btn-secondary share-wa-text" target="_blank" rel="noopener noreferrer" hidden>${t("open_wa")}</a>
              <button class="btn-secondary" type="button" data-copy-url hidden>${t("ig_copy_link")}</button>
            </div>
          </div><textarea class="manual-copy" aria-label="${t("manual_copy")}" readonly hidden></textarea>` : ""}
        </div>
        <div class="next-section-title">${t("next_title")}</div>
        <div class="next-grid">
          <button class="next-card nc-green" data-goto="congreso"><h4>${t("nc1_t")}</h4><span>${t("nc1_s")}</span></button>
          <button class="next-card" data-goto="provincia"><h4>${t("nc2_t")}</h4><span>${t("nc2_s")}</span></button>
          <button class="next-card nc-red" data-goto="bulos"><h4>${t("nc3_t")}</h4><span>${t("nc3_s")}</span></button>
        </div>
      `;
      const extraBtn = root.querySelector("#btn-extra");
      if (extraBtn) extraBtn.addEventListener("click", () => { state.extraUnlocked = true; state.showResults = false; state.currentIdx = 18; renderTest(); });
      attachSharing(root, pct, agree.length, totalStance);
      root.querySelector("#btn-restart").addEventListener("click", () => { state.showResults = false; state.currentIdx = 0; renderTest(); });
      root.querySelectorAll("[data-goto]").forEach(b => b.addEventListener("click", () => switchTab(b.dataset.goto)));
    }

    function buildHemicycleSVG(mode) {
      const favorCount = mode === "29" ? 35 : 34;
      const rows = [[78, 13], [102, 17], [126, 19], [150, 20]];
      const cx = 170, cy = 165;
      let dots = "", idx = 0;
      rows.forEach(([r, count]) => {
        for (let j = 0; j < count; j++) {
          const ang = Math.PI - (j / (count - 1)) * Math.PI;
          const x = (cx + r * Math.cos(ang)).toFixed(1), y = (cy - r * Math.sin(ang)).toFixed(1);
          let col = "#B83B2A";
          if (idx < favorCount) col = "#1B6B4A";
          dots += `<circle cx="${x}" cy="${y}" r="4.8" fill="${col}" />`;
          idx++;
        }
      });
      return `<svg viewBox="0 0 340 180" width="100%" aria-label="Hemiciclo 69 escanos">${dots}</svg>`;
    }

    function votePill(party, code) {
      const isGl = state.lang === "gl";
      let cls = "", lbl = code;
      if (code === "SI") { cls = "v-si"; lbl = "SÍ"; }
      else if (code === "NO" || code === "NO*") { cls = "v-no"; lbl = isGl ? (code === "NO*" ? "NON*" : "NON") : code; }
      else if (code === "AB") { cls = "v-ab"; lbl = "ABST."; }
      else { lbl = isGl ? "SEN ESC." : "SIN ESC."; }
      return `<div class="vp ${cls}"><span class="vp-p">${party}</span><span class="vp-v">${lbl}</span></div>`;
    }

    function coincidenceRows() {
      const votes = VOTES.filter(item => ["SI", "NO", "AB"].includes(item.v.bng));
      const parties = [["psoe", "PSOE"], ["sum", "Sumar / UP*"], ["pp", "PP"], ["vox", "Vox"]];
      return parties.map(([key, label]) => {
        const count = votes.filter(({v}) => v[key].replace("*", "") === v.bng).length;
        const width = votes.length ? 100 * count / votes.length : 0;
        return `<div class="coinc-row"><span class="coinc-party">${label}</span><div class="bar-track"><div class="bar-fill" style="width:${width}%"></div></div><span class="coinc-score">${count} / ${votes.length}</span></div>`;
      }).join("");
    }

    function renderCongreso() {
      const root = document.getElementById("congreso-root");
      const showBal = state.cgView === "balance" || state.cgView === "both";
      const showVot = state.cgView === "votes" || state.cgView === "both";
      const filteredBal = state.cgFilter === "all" ? BALANCE : BALANCE.filter(b => b.status === state.cgFilter);
      const msLabels = [t("ms_1"), t("ms_2"), t("ms_3"), t("ms_4")];

      const balCardsHtml = filteredBal.map(item => {
        const d = item[state.lang];
        const msHtml = msLabels.map((lbl, i) => `<div class="ms-step ${i < item.step ? `done-${item.status} is-on` : ""}"><div class="ms-bar"></div><span>${lbl}</span></div>`).join("");
        return `<article class="bal-card"><div class="bal-badge st-${item.status}">${d.badge}</div><div class="bal-head"><h3>${d.title}</h3><span class="bal-kpi">${item.kpi}</span></div><div class="milestones">${msHtml}</div><p class="bal-summary">${d.sum}</p><div class="accordion-group"><details class="acc"><summary>${t("cg_a1")}</summary><div class="acc-body">${d.done}<p class="source-links">${sourceLinks(item.sources)}</p></div></details><details class="acc"><summary>${t("cg_a2")}</summary><div class="acc-body">${d.fine}</div></details><details class="acc"><summary>${t("cg_a3")}</summary><div class="acc-body">${d.crit}</div></details></div></article>`;
      }).join("");

      const rdlFav = state.rdlMode === "29" ? "35" : "34", rdlCon = state.rdlMode === "29" ? "34" : "35";
      const votesHtml = VOTES.map(vt => {
        const d = vt[state.lang];
        return `<article class="v-card"><div class="v-meta">${vt.date} · ${vt.res}</div><h3 class="v-title">${d.t}</h3><div class="v-pills">${votePill("PP",vt.v.pp)}${votePill("PSOE",vt.v.psoe)}${votePill("Vox",vt.v.vox)}${votePill(vt.sumLbl,vt.v.sum)}${votePill("BNG",vt.v.bng)}</div><div class="accordion-group"><details class="acc"><summary>${t("v_acc")}</summary><div class="acc-body">${d.n}<p class="source-links">${sourceLinks(vt.sources)}</p></div></details></div></article>`;
      }).join("");

      root.innerHTML = `
        <div class="sub-controls">
          <div class="seg-switch">
            <button class="seg-btn ${state.cgView === 'balance' ? 'active' : ''}" data-cgv="balance">${t("cg_v_bal")}</button>
            <button class="seg-btn ${state.cgView === 'votes' ? 'active' : ''}" data-cgv="votes">${t("cg_v_vot")}</button>
            <button class="seg-btn ${state.cgView === 'both' ? 'active' : ''}" data-cgv="both">${t("cg_v_both")}</button>
          </div>
          ${showBal ? `<div class="sem-bar">
            <button class="sem-pill ${state.cgFilter === 'all' ? 'active' : ''}" data-cgf="all">${t("cg_f_all")}</button>
            <button class="sem-pill ${state.cgFilter === 'boe' ? 'active' : ''}" data-cgf="boe"><span class="dot dot-green"></span>${t("cg_f_boe")}</button>
            <button class="sem-pill ${state.cgFilter === 'parcial' ? 'active' : ''}" data-cgf="parcial"><span class="dot dot-amber"></span>${t("cg_f_par")}</button>
            <button class="sem-pill ${state.cgFilter === 'decaida' ? 'active' : ''}" data-cgf="decaida"><span class="dot dot-red"></span>${t("cg_f_dec")}</button>
          </div>` : ""}
        </div>
        ${showBal ? `<div class="congreso-grid"><div class="balance-list">${balCardsHtml}</div><aside class="hemi-card"><h3>${t("hemi_t")}</h3><div class="hemi-sub">${t("hemi_sub")}</div><div class="rdl-toggle"><button class="rdl-btn ${state.rdlMode === '29' ? 'active' : ''}" data-rdl="29">RDL 29/2026 (35–34)</button><button class="rdl-btn ${state.rdlMode === '28' ? 'active' : ''}" data-rdl="28">RDL 28/2026 (34–35)</button></div><div class="hemi-svg-wrap">${buildHemicycleSVG(state.rdlMode)}</div><div class="hemi-legend"><span style="color:var(--green)">${rdlFav} A FAVOR</span><span style="color:var(--red)">${rdlCon} EN CONTRA</span></div><p class="hemi-note">${t("hemi_note")}</p><div class="accordion-group"><details class="acc"><summary>${t("hemi_acc_t")}</summary><div class="acc-body">${t("hemi_acc_b")}<p class="source-links">${sourceLinks(["vote11"])}</p></div></details></div></aside></div>` : ""}
        ${showVot ? `<div class="coinc-card"><div class="coinc-title">${t("coinc_t")}</div>
          ${coincidenceRows()}
          <p class="reading-note">${t("method")}</p>
        </div><div class="votes-grid">${votesHtml}</div>` : ""}
      `;
      root.querySelectorAll("[data-cgv]").forEach(b => b.addEventListener("click", () => { state.cgView = b.dataset.cgv; renderCongreso(); }));
      root.querySelectorAll("[data-cgf]").forEach(b => b.addEventListener("click", () => { state.cgFilter = b.dataset.cgf; renderCongreso(); }));
      root.querySelectorAll("[data-rdl]").forEach(b => b.addEventListener("click", () => { state.rdlMode = b.dataset.rdl; renderCongreso(); }));
    }

    // ================= RENDER PROVINCIA =================
    function renderProvincia() {
      const root = document.getElementById("provincia-root");
      const p = PROVINCES[state.prov];
      const es = state.lang === "es";

      const selectorHtml = Object.entries(PROVINCES).map(([key, item]) => {
        return `<button class="prov-btn ${state.prov === key ? 'active' : ''}" data-prov="${key}" aria-pressed="${state.prov === key}"><span class="prov-name">${item.name}</span><span class="prov-st">${item.seats} ${es ? "escaños" : "escanos"}</span></button>`;
      }).join("");

      const number = new Intl.NumberFormat(es ? "es-ES" : "gl-ES", {useGrouping: true});
      const maxVotes = Math.max(...p.bars.map(b => b.v));
      const barsHtml = p.bars.map(b => `<tr><th scope="row">${b.p}</th><td><div class="bar-track" aria-hidden="true"><div class="bar-fill" style="width:${100*b.v/maxVotes}%;background:${b.col}"></div></div></td><td>${number.format(b.v)}</td><td>${b.e}</td></tr>`).join("");

      const seatPoints = SEAT_COMP[state.seatMode][state.lang].map(txt => `<li>${txt}</li>`).join("");
      const casesHtml = DISCIPLINE_CASES.map(c => `<div class="case-item"><strong>${c[state.lang].t}</strong>${c[state.lang].b}</div>`).join("");

      root.innerHTML = `
        <div class="prov-selector">${selectorHtml}</div>
        <section class="province-outlook" aria-labelledby="province-outlook-title">
          <h2 id="province-outlook-title">${p.outlook[state.lang].title}</h2>
          <p>${p.outlook[state.lang].body}</p>
        </section>
        <div class="prov-grid">
          <div class="prov-card">
            <div class="prov-kicker">${p.name} · ${p.seats} ${es ? "escaños" : "escanos"}</div>
            <h3>${t("pr_chart_t")}</h3>
            <table class="result-table"><thead><tr><th scope="col">Candidatura</th><th aria-label="Votos relativos"></th><th scope="col">Votos</th><th scope="col">${es ? "Escaños" : "Escanos"}</th></tr></thead><tbody>${barsHtml}</tbody></table>
            <p class="source-links">${sourceLinks(["results"])}</p>
            <div class="accordion-group">
              <details class="acc">
                <summary>${t("fundHead")}</summary>
                <div class="acc-body">${t("fundBody")}<p class="source-links">${sourceLinks(["funding","rules"])}</p></div>
              </details>
              <details class="acc">
                <summary>${t("pr_lugo_acc")}</summary>
                <div class="acc-body">${t("pr_lugo_b")}<p class="source-links">${sourceLinks(["rules"])}</p></div>
              </details>
            </div>
          </div>

          <div class="prov-card">
            <div class="prov-kicker" style="color:var(--muted)">${t("seat_kicker")}</div>
            <h3>${t("seat_t")}</h3>
            <div class="seat-tabs">
              <button class="seat-btn ${state.seatMode === '0' ? 'active' : ''}" data-sm="0">${t("seat_0")}</button>
              <button class="seat-btn ${state.seatMode === '1' ? 'active' : ''}" data-sm="1">${t("seat_1")}</button>
              <button class="seat-btn ${state.seatMode === '2' ? 'active' : ''}" data-sm="2">${t("seat_2")}</button>
            </div>
            <ul class="seat-points">${seatPoints}</ul>
          </div>
        </div>

        <div class="deep-acc-card">
          <details class="acc">
            <summary>${t("disc_t")}</summary>
            <div class="acc-body"><div class="case-grid">${casesHtml}</div></div>
          </details>
        </div>

        <div class="deep-acc-card">
          <details class="acc">
            <summary>${t("youth_t")}</summary>
            <div class="acc-body">
              <div class="youth-bars">
                <div>
                  <div class="area-row-top"><span>${state.lang === "gl" ? "Maiores de 64 anos (peso no voto efectivo)" : "Mayores de 64 años (peso en el voto efectivo)"}</span><span class="area-val">25,1%</span></div>
                  <div class="bar-track"><div class="bar-fill" style="width:25.1%;background:var(--ink)"></div></div>
                </div>
                <div>
                  <div class="area-row-top"><span>${state.lang === "gl" ? "Menores de 35 anos (peso no voto efectivo)" : "Menores de 35 años (peso en el voto efectivo)"}</span><span class="area-val" style="color:var(--red)">18,7%</span></div>
                  <div class="bar-track"><div class="bar-fill" style="width:18.7%;background:var(--red)"></div></div>
                </div>
              </div>
              <p>${t("youth_b")}</p>
            </div>
          </details>
        </div>
      `;

      root.querySelectorAll("[data-prov]").forEach(b => b.addEventListener("click", () => { state.prov = b.dataset.prov; renderProvincia(); }));
      root.querySelectorAll("[data-sm]").forEach(b => b.addEventListener("click", () => { state.seatMode = b.dataset.sm; renderProvincia(); }));
    }

    function renderBulos() {
      document.getElementById("sf-grid").innerHTML = BULOS_REFERENCES.map(ref =>
        `<span class="sf-pill">${ref[state.lang]}</span>`
      ).join("");

      const root=document.getElementById("bulos-root");
      const sb=state.bulosView==="bul"||state.bulosView==="all",sd=state.bulosView==="deb"||state.bulosView==="all";
      const bul=DUBIDAS.map(d=>{const l=d[state.lang];return `<details class="acc"><summary class="bulo-sum"><span class="b-tag ${d.type}">${d.type==="bulo"?t("tag_b"):t("tag_d")}</span><span>${l.t}</span></summary><div class="acc-body"><ul class="acc-points">${l.pts.map(p=>`<li>${p}</li>`).join("")}</ul>${d.sources.length ? `<p class="source-links">${sourceLinks(d.sources)}</p>` : ""}</div></details>`}).join("");
      const deb=DEBATES.map(d=>{const l=d[state.lang];const maximum = Math.max(...d.bars.map(b => b.value || 0));
      const bars = d.bars.map(b => {
        const widths = maximum ? [100 * b.value / maximum] : (b.range || (b.percent != null ? [b.percent] : []));
        const track = widths.length ? `<div class="indicator-tracks" aria-hidden="true">${widths.map(w =>
          `<div class="bar-track"><div class="bar-fill" style="width:${Math.abs(w)}%;background:${b.c};${w < 0 ? "margin-left:auto" : ""}"></div></div>`
        ).join("")}</div>` : "";
        const value = state.lang === "es" && b.esValue ? b.esValue : b.v;
        return `<div class="mc-row ${track ? "" : "metric-pair"}"><span class="mc-lbl">${b.label[state.lang]}</span>${track}<span class="mc-val">${value}</span></div>`;
      }).join("");
      return `<article class="deb-card"><div class="deb-num">DATO ${d.id} / 05</div><h3>${l.t}</h3><div class="mini-chart">${bars}</div><div class="accordion-group"><details class="acc"><summary>${t("a1")}</summary><div class="acc-body">${l.r}</div></details><details class="acc"><summary>${t("a2")}</summary><div class="acc-body">${l.d}</div></details><details class="acc"><summary>${t("a3")}</summary><div class="acc-body">${l.e}</div></details></div><div class="bng-line"><strong>${t("bng_lbl")}</strong>${l.p}</div><p class="source-links">${sourceLinks(d.sources)}</p></article>`}).join("");
      root.innerHTML=`<div class="seg-switch"><button class="seg-btn ${state.bulosView==="bul"?"active":""}" data-v="bul">${t("v_bul")}</button><button class="seg-btn ${state.bulosView==="deb"?"active":""}" data-v="deb">${t("v_deb")}</button><button class="seg-btn ${state.bulosView==="all"?"active":""}" data-v="all">${t("v_all")}</button></div>${sb?`<div class="sec-kicker">${t("k_bul")}</div><div class="bulos-list">${bul}</div>`:""}${sd?`<div class="sec-kicker">${t("k_deb")}</div><div class="debates-grid">${deb}</div>`:""}`;
      root.querySelectorAll("[data-v]").forEach(b=>b.addEventListener("click",()=>{state.bulosView=b.dataset.v;renderBulos()}));}

    function renderLanguage() {
      applyStaticI18n();
      renderTest();
      renderCongreso();
      renderProvincia();
      renderBulos();
    }

    document.querySelectorAll(".lang-btn").forEach(btn => btn.addEventListener("click", () => {
      state.lang = btn.dataset.lang;
      renderLanguage();
    }));
    document.querySelectorAll(".tab-btn").forEach(btn => btn.addEventListener("click", () => switchTab(btn.dataset.tab)));

    renderLanguage();
    switchTab("test");
  </script>
</body>
</html>
